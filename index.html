<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Deudores Anónimos</title>
    <meta name="description" content="Organiza tus deudas, tarjetas y pagos fijos. Todo se queda en tu navegador: aquí nadie sabe tu nombre." />
    <link rel="icon" href="/deudas/icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/deudas/icons/icon-192.png" />

    <!-- Para que se instale igual en iOS: Safari no lee el manifiesto para
         esto, necesita sus propias metas. Sin `apple-mobile-web-app-capable`
         la app abre dentro de Safari con su barra encima, aunque el icono ya
         esté en la pantalla de inicio. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Deudores" />
  </head>

    <script type="module" src="/src/main.tsx"></script>
